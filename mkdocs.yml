site_name: Unsupervised Machine Learning Workshop
site_description: Practical unsupervised machine learning workshops by Gabriela Granja
site_url: https://bootcamp-ia-mad-p7.github.io/unsupervised-ml-workshop/
repo_url: https://github.com/Bootcamp-IA-MAD-P7/unsupervised-ml-workshop
repo_name: Bootcamp-IA-MAD-P7/unsupervised-ml-workshop

theme:
  name: material
  features:
    - navigation.tabs
    - navigation.sections
    - content.code.copy
    - toc.follow
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: black
      accent: grey
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: black
      accent: grey
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

nav:
  - Home: index.md
  - Mushroom Workshop: mushroom.md
  - Credit Card Workshop: credit-card.md

exclude_docs: |
  daily/
  paper/
  decisions.md
  methodology.md
  notebook-spec.md
  project-constitution.md
  project-plan.md
  references.md

plugins:
  - search

markdown_extensions:
  - admonition
  - attr_list
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

extra_css:
  - assets/stylesheets/extra.css

extra:
  generator: false
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/Bootcamp-IA-MAD-P7/unsupervised-ml-workshop
      name: Project repository

copyright: Developed by Gabriela Granja · Machine Learning Bootcamp Project

strict: true
